[project]
name = "sakura-iam-cli"
version = "0.9.0"
description = "A small CLI wrapper for the Sakura Cloud IAM API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43.0.0",
  "questionary>=2.1.1",
  "typer>=0.16.0",
]

[project.scripts]
sakura-iam-cli = "sakura_iam_cli.cli:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
